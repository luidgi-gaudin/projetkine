# =====================================================================
#  Interface Zabbix de l'équipe Réseau, servie sur https://<domaine>:8443.
#  Activée uniquement sur le serveur, par compose.override.yaml (généré par deploy/vps/install.sh
#  quand un conteneur zabbix-web tourne). La résolution à la volée évite que nginx refuse de
#  démarrer si Zabbix est arrêté.
# =====================================================================
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $zabbix_upstream http://zabbix-web:8080;
        proxy_pass $zabbix_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
