<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Hanken Grotesk Variable, Helvetica, Arial, sans-serif" role="img" aria-label="Schéma d'architecture de Synégo en production">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0a1d35"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2f6e98"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#0a1d35;stroke-width:1.3}
      .ext{fill:#d0e7f5;stroke:#2f6e98;stroke-width:1.2}
      .usr{fill:#f2e8dc;stroke:#b9a68d;stroke-width:1.2}
      .int{fill:#f8f3ec;stroke:#0a1d35;stroke-width:1.2;stroke-dasharray:5 4}
      .res{fill:#e7f3ec;stroke:#2e7d5b;stroke-width:1.2}
      .t{font-size:13px;font-weight:650;fill:#0a1d35}
      .s{font-size:10.5px;fill:#3a4a60}
      .l{font-size:10px;fill:#0a1d35;font-weight:600}
      .lb{font-size:10px;fill:#2f6e98;font-weight:600}
      .f{fill:none;stroke:#0a1d35;stroke-width:1.4}
      .fb{fill:none;stroke:#2f6e98;stroke-width:1.3}
      .fd{fill:none;stroke:#0a1d35;stroke-width:1.4;stroke-dasharray:6 4}
      .halo{paint-order:stroke;stroke:#fbf8f3;stroke-width:4px;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Services externes -->
  <text x="250" y="14" class="s" font-weight="600" letter-spacing="1.5">SERVICES EXTERNES</text>
  <rect class="ext" x="250" y="22" width="170" height="74" rx="10"/>
  <text x="335" y="52" class="t" text-anchor="middle">Firebase Auth</text>
  <text x="335" y="70" class="s" text-anchor="middle">e-mail, SMS, Google</text>
  <text x="335" y="85" class="s" text-anchor="middle">aucun mot de passe chez nous</text>
  <rect class="ext" x="437" y="22" width="170" height="74" rx="10"/>
  <text x="522" y="52" class="t" text-anchor="middle">Calendly</text>
  <text x="522" y="70" class="s" text-anchor="middle">agenda des rendez-vous</text>
  <text x="522" y="85" class="s" text-anchor="middle">API + webhook signé</text>
  <rect class="ext" x="623" y="22" width="170" height="74" rx="10"/>
  <text x="708" y="52" class="t" text-anchor="middle">Google Meet</text>
  <text x="708" y="70" class="s" text-anchor="middle">séances en visio</text>
  <text x="708" y="85" class="s" text-anchor="middle">rien n'est enregistré</text>
  <rect class="ext" x="810" y="22" width="170" height="74" rx="10"/>
  <text x="895" y="52" class="t" text-anchor="middle">GitHub</text>
  <text x="895" y="70" class="s" text-anchor="middle">code + CI (Actions)</text>
  <text x="895" y="85" class="s" text-anchor="middle">5 contrôles avant la prod</text>

  <!-- Utilisateurs -->
  <text x="20" y="150" class="s" font-weight="600" letter-spacing="1.5">INTERNET</text>
  <rect class="usr" x="20" y="160" width="190" height="66" rx="10"/>
  <text x="115" y="187" class="t" text-anchor="middle">Visiteurs, prospects</text>
  <text x="115" y="205" class="s" text-anchor="middle">site vitrine, devis, RDV</text>
  <rect class="usr" x="20" y="250" width="190" height="66" rx="10"/>
  <text x="115" y="277" class="t" text-anchor="middle">Clients</text>
  <text x="115" y="295" class="s" text-anchor="middle">espace client /espace</text>
  <rect class="usr" x="20" y="340" width="190" height="66" rx="10"/>
  <text x="115" y="367" class="t" text-anchor="middle">Coach</text>
  <text x="115" y="385" class="s" text-anchor="middle">back-office /admin</text>
  <rect class="usr" x="20" y="480" width="190" height="66" rx="10"/>
  <text x="115" y="507" class="t" text-anchor="middle">Équipe technique</text>
  <text x="115" y="525" class="s" text-anchor="middle">SSH par clé uniquement</text>

  <!-- VPS -->
  <rect x="250" y="122" width="730" height="508" rx="14" fill="#fbf8f3" stroke="#0a1d35" stroke-width="2"/>
  <text x="270" y="619" class="t" font-size="12">VPS Linode · Ubuntu 26.10 · Docker Compose</text>
  <text x="545" y="619" class="s">pare-feu UFW : seuls 22 (SSH), 80, 443, 8443 (Zabbix) et 51820/udp sont ouverts</text>

  <rect class="box" x="290" y="190" width="180" height="96" rx="10"/>
  <text x="380" y="218" class="t" text-anchor="middle">nginx</text>
  <text x="380" y="237" class="s" text-anchor="middle">HTTPS Let's Encrypt</text>
  <text x="380" y="252" class="s" text-anchor="middle">CSP, HSTS, limite de débit</text>
  <text x="380" y="271" class="l" text-anchor="middle">ports 80 · 443 · 8443</text>

  <rect class="box" x="500" y="190" width="180" height="96" rx="10"/>
  <text x="590" y="218" class="t" text-anchor="middle">API .NET 10</text>
  <text x="590" y="237" class="s" text-anchor="middle">Minimal API · EF Core</text>
  <text x="590" y="252" class="s" text-anchor="middle">rappels 48 h / 24 h</text>
  <text x="590" y="271" class="l" text-anchor="middle">réseau Docker interne</text>

  <rect class="box" x="500" y="330" width="180" height="86" rx="10"/>
  <text x="590" y="358" class="t" text-anchor="middle">PostgreSQL 17</text>
  <text x="590" y="376" class="s" text-anchor="middle">schéma synego</text>
  <text x="590" y="392" class="s" text-anchor="middle">4 comptes aux droits limités</text>
  <text x="590" y="406" class="l" text-anchor="middle">jamais exposé</text>

  <rect class="box" x="290" y="330" width="180" height="86" rx="10"/>
  <text x="380" y="358" class="t" text-anchor="middle">Sauvegarde</text>
  <text x="380" y="376" class="s" text-anchor="middle">pg_dump chiffré AES-256</text>
  <text x="380" y="392" class="s" text-anchor="middle">chaque nuit à 2 h, 14 jours</text>
  <text x="380" y="406" class="l" text-anchor="middle">+ avant chaque déploiement</text>

  <rect class="res" x="290" y="460" width="180" height="76" rx="10"/>
  <text x="380" y="488" class="t" text-anchor="middle">Supervision Zabbix</text>
  <text x="380" y="506" class="s" text-anchor="middle">équipe Réseau</text>
  <text x="380" y="522" class="s" text-anchor="middle">servie sur :8443 par nginx</text>

  <rect class="box" x="750" y="190" width="200" height="44" rx="9"/>
  <text x="850" y="210" class="t" text-anchor="middle" font-size="12">certbot</text>
  <text x="850" y="225" class="s" text-anchor="middle">renouvelle le certificat</text>
  <rect class="box" x="750" y="244" width="200" height="44" rx="9"/>
  <text x="850" y="264" class="t" text-anchor="middle" font-size="12">migrate</text>
  <text x="850" y="279" class="s" text-anchor="middle">structure de la base (owner)</text>

  <rect class="box" x="750" y="330" width="200" height="86" rx="10"/>
  <text x="850" y="356" class="t" text-anchor="middle">Déploiement continu</text>
  <text x="850" y="374" class="s" text-anchor="middle">timer systemd, toutes les 2 min</text>
  <text x="850" y="389" class="s" text-anchor="middle">sauvegarde, contrôle de santé,</text>
  <text x="850" y="404" class="s" text-anchor="middle">retour arrière automatique</text>

  <rect class="int" x="750" y="446" width="200" height="110" rx="10"/>
  <text x="850" y="471" class="t" text-anchor="middle">Outils internes</text>
  <text x="850" y="488" class="lb" text-anchor="middle">127.0.0.1 uniquement</text>
  <text x="850" y="507" class="s" text-anchor="middle">Adminer :8082 (base)</text>
  <text x="850" y="522" class="s" text-anchor="middle">Uptime Kuma :3001 · Mailpit :8025</text>
  <text x="850" y="537" class="s" text-anchor="middle">zone admin :8444</text>

  <!-- Flux -->
  <path class="f" d="M210 193 C250 193 255 220 288 220" marker-end="url(#a)"/>
  <path class="f" d="M210 283 C250 283 255 245 288 245" marker-end="url(#a)"/>
  <path class="f" d="M210 373 C255 373 255 268 288 268" marker-end="url(#a)"/>
  <text x="214" y="240" class="l halo">HTTPS 443</text>

  <path class="f" d="M470 238 H498" marker-end="url(#a)"/>
  <text x="484" y="231" class="l halo" text-anchor="middle">/api</text>
  <path class="f" d="M590 286 V328" marker-end="url(#a)"/>
  <text x="597" y="311" class="l halo">synego_app</text>
  <path class="f" d="M470 373 H498" marker-end="url(#a)"/>
    <path class="f" d="M290 278 H272 V498 H288" marker-end="url(#a)"/>
  <text x="276" y="444" class="l halo">:8443</text>
  <path class="f" d="M750 266 H722 V372 H682" marker-end="url(#a)"/>
  <path class="fd" d="M750 500 H722 V430 H600 V418" marker-end="url(#a)"/>
  <text x="640" y="443" class="l halo">synego_readonly</text>

  <path class="fb" d="M540 190 V112 H335 V98" marker-end="url(#b)"/>
  <text x="360" y="109" class="lb halo">vérifie les jetons</text>
  <path class="fb" d="M600 190 V98" marker-end="url(#b)"/>
  <path class="fb" d="M115 160 V59 H248" marker-end="url(#b)"/>
  <text x="122" y="118" class="lb halo">connexion, agenda,</text>
  <text x="122" y="131" class="lb halo">visio (navigateur)</text>
  <path class="fb" d="M965 98 V373 H952" marker-end="url(#b)"/>
  <text x="958" y="160" class="lb halo" text-anchor="end">pull de main</text>
  <text x="958" y="173" class="lb halo" text-anchor="end">si CI verte</text>

  <path class="fd" d="M210 513 H232 V594 H850 V558" marker-end="url(#a)"/>
  <text x="300" y="588" class="l halo">tunnel SSH (port 22, clé) : seul chemin vers les outils internes et la base</text>

  <!-- Légende -->
  <line x1="20" y1="574" x2="48" y2="574" class="f"/>
  <text x="54" y="578" class="s">flux autorisé</text>
  <line x1="20" y1="590" x2="48" y2="590" class="fd"/>
  <text x="54" y="594" class="s">administration</text>
  <line x1="20" y1="606" x2="48" y2="606" class="fb"/>
  <text x="54" y="610" class="s">service externe</text>
</svg>
